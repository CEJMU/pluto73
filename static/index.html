<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pluto SDR Web Client</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Title and Status -->
      <div class="header">
        <h1>Pluto SDR</h1>
        <span id="status">disconnected</span>
        <div class="control-group push-right">
          <button id="run-status-toggle" class="run-badge" disabled>Stopped</button>
        </div>
      </div>

      <!-- Antenna Waterfall Speed FFT Resolution -->
      <div class="toolbar">
        <div class="control-group">
          <label for="antenna-select">Antenna:</label>
          <select id="antenna-select">
            <option value="0" selected>0</option>
            <option value="1">1</option>
          </select>
        </div>

        <div class="control-group">
          <label for="waterfall-speed">Waterfall Speed:</label>
          <select id="waterfall-speed">
            <option
              value="0"
              title="Warning: High CPU and network usage! Runs at maximum hardware speed."
            >
              Max (High CPU) ⚠️ (~300+ FPS)
            </option>
            <option value="15">Very Fast (66 FPS)</option>
            <option value="20">Fast (50 FPS)</option>
            <option value="50" selected>Normal (20 FPS)</option>
            <option value="100">Slow (10 FPS)</option>
            <option value="250">Very Slow (4 FPS)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="waterfall-fft-size">FFT Resolution:</label>
          <select id="waterfall-fft-size">
            <option value="2048">Coarse (2048)</option>
            <option value="4096">Medium (4096)</option>
            <option value="8192" selected>Fine (8192)</option>
            <option
              value="16384"
              title="Warning: Higher CPU cost per row."
            >
              Very Fine (16384)
            </option>
          </select>
        </div>
      </div>

      <!-- SDR Center | Analog BW -->
      <div class="toolbar mt-n8">
        <div class="control-group">
          <label for="center-freq">SDR Center (Hz):</label>
          <input type="number" id="center-freq" value="99300000" />
          <button id="set-center-freq">Set</button>
        </div>

        <div class="control-group ml-20">
          <label for="rf-bandwidth">RX Analog BW (Hz):</label>
          <input
            type="number"
            id="rf-bandwidth"
            value="3840000"
            min="200000"
            max="40000000"
            step="100000"
            disabled
          />
          <button id="set-rf-bandwidth" disabled>Set</button>
          <input
            type="checkbox"
            id="sync-rf-bw"
            checked
            class="sync-checkbox ml-5"
            title="Keeps the analog RX filter bandwidth locked to the hardware span (sample rate). Uncheck to enter a value manually - note that zooming re-syncs it to the new span."
            disabled
          />
          <label
            for="sync-rf-bw"
            class="sync-label"
            title="Keeps the analog RX filter bandwidth locked to the hardware span (sample rate). Uncheck to enter a value manually - note that zooming re-syncs it to the new span."
            >Sync</label
          >
        </div>

        <div class="control-group ml-20">
          <label
            for="freq-offset"
            title="External converter/transverter offset: displayed frequency = hardware + offset"
            >External Offset (Hz):</label
          >
          <input type="number" id="freq-offset" value="0" />
          <button id="set-freq-offset">Set</button>
        </div>
      </div>
      <!-- Waterfall -->
      <div class="waterfall-container">
        <canvas id="waterfallCanvas"></canvas>
        <div id="hover-tooltip"></div>
      </div>
      <!-- Waterfall Visual Scale -->
      <div class="toolbar wf-scale-toolbar">
        <div class="control-group">
          <span>Waterfall Scale:</span>
        </div>
        <div class="control-group">
          <label for="wf-min-db">Min dB:</label>
          <input
            type="range"
            id="wf-min-db"
            min="-120"
            max="-60"
            value="-100"
            step="5"
          />
          <span id="wf-min-db-val" class="readout">-100 dB</span>
        </div>
        <div class="control-group ml-20">
          <label for="wf-max-db">Max dB:</label>
          <input
            type="range"
            id="wf-max-db"
            min="-59"
            max="-10"
            value="-40"
            step="5"
          />
          <span id="wf-max-db-val" class="readout">-40 dB</span>
        </div>
        <div class="control-group ml-20">
          <button id="wf-reset">Reset Defaults</button>
        </div>
      </div>
      <!-- Listening Controls (Frequency, Filter, Volume) -->
      <div class="toolbar rx-controls">
        <div class="rx-row">
          <div class="control-group">
            <label for="frequency">Listening Frequency (Hz):</label>
            <input type="number" id="frequency" value="99300000" />
            <button id="set-frequency" disabled>Set</button>
          </div>
          <div class="control-group push-right">
            <label for="mode-select">Filter:</label>
            <select id="mode-select">
              <option value="FM">FM</option>
              <option value="USB">USB</option>
              <option value="LSB">LSB</option>
            </select>
            <input
              type="number"
              id="filter-bw"
              value="15000"
              title="Filter Bandwidth (Hz)"
            />
            <button id="set-filter-bw">Set BW</button>
          </div>
        </div>
        <div class="rx-row-footer">
          <div class="control-group">
            <label for="vol">Volume:</label>
            <input type="range" id="vol" min="0" max="200" value="0" />
          </div>
          <div class="control-group ml-15">
            <label for="mute-checkbox">Mute:</label>
            <input type="checkbox" id="mute-checkbox" checked disabled />
          </div>
          <div class="control-group ml-15">
            <label for="squelch-slider" title="Power Squelch: Mutes background static when signal is below threshold">Squelch:</label>
            <input
              type="range"
              id="squelch-slider"
              min="-100"
              max="-10"
              value="-88"
              step="1"
              title="Squelch Threshold (-100 dB = Off)"
            />
            <span id="squelch-val" class="readout">-88 dB</span>
          </div>
        </div>
      </div>

      <!-- Gain & Telemetry Controls -->
      <div class="toolbar">
        <div class="control-group">
          <label for="rx-gain-mode">RX Gain Mode:</label>
          <select id="rx-gain-mode" disabled>
            <option value="slow_attack" selected>AGC (Slow)</option>
            <option value="fast_attack">AGC (Fast)</option>
            <option value="manual">Manual</option>
          </select>
        </div>
        <div class="control-group">
          <label for="rx-gain">RX Gain:</label>
          <input
            type="range"
            id="rx-gain"
            min="-3"
            max="71"
            value="30"
            step="0.5"
            disabled
          />
          <span id="rx-gain-val" class="readout">30.0 dB</span>
        </div>
        <div class="control-group ml-15">
          <label for="tx-gain">TX Gain:</label>
          <input
            type="range"
            id="tx-gain"
            min="-89.75"
            max="0"
            value="-89.75"
            step="0.25"
            disabled
          />
          <span id="tx-gain-val" class="readout">-89.75 dB</span>
        </div>
      </div>

      <!-- Transmit Controls -->
      <div class="toolbar tx-controls">
        <!-- First Row: Controls (left) and Mode/Filter (right) -->
        <div class="tx-row">
          <div class="tx-row-group">
            <div class="control-group">
              <label>Transmit (TX):</label>
              <button id="tx-mic" disabled>Mic TX</button>
            </div>
            <div class="control-group">
              <label for="tx-file">File TX:</label>
              <input type="file" id="tx-file" accept="audio/*" disabled />
              <button id="tx-file-confirm">Send File</button>
            </div>
          </div>

          <div class="control-group push-right">
            <label for="tx-mode-select">Mode:</label>
            <select id="tx-mode-select">
              <option value="USB">USB</option>
              <option value="LSB">LSB</option>
            </select>
            <input type="number" id="tx-filter-bw" value="3000" step="500" />
          </div>
        </div>

        <!-- Second Row: TX LO Offset (left), Sync and TX Status (right aligned) -->
        <div class="tx-row-footer">
          <div
            class="control-group push-left"
            title="Frequency offset (Hz) between the TX LO and the transmitted signal, applied by the FPGA DDS. Keeps the TX LO leakage (carrier spike, pink bar in the waterfall) away from your signal. Can also be changed by dragging the pink bar."
          >
            <label for="tx-offset">TX LO Offset (Hz):</label>
            <input type="number" id="tx-offset" value="1000000" step="1000" />
            <button id="set-tx-offset">Set</button>
          </div>
          <div class="sync-wrap">
            <input
              type="checkbox"
              id="sync-rx-tx"
              checked
              class="sync-checkbox"
            />
            <label for="sync-rx-tx" class="sync-label">Sync</label>
          </div>
          <span id="tx-status" class="tx-badge">TX Ready</span>
        </div>
      </div>
      <!-- TX Status Bar -->
      <div class="tx-status-bar">
        <div class="status-row">
          <span
            ><strong>TX LO Freq:</strong>
            <span id="tx-status-lo-val" class="tx-val">99.288 MHz</span></span
          >
        </div>
      </div>
      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-row">
          <div class="status-group">
            <span
              ><strong>Hardware Span:</strong>
              <span id="hardware-span-val" class="status-val">3.84 MHz</span></span
            >
            <span
              ><strong>Visual Span:</strong>
              <span id="visual-span-val" class="status-val">3.84 MHz</span></span
            >
          </div>
          <div class="status-group">
            <span
              ><strong>Zoom:</strong>
              <span id="zoom-status" class="status-val">Hardware Adjusted</span></span
            >
            <span
              ><strong>Zoom Stage:</strong>
              <span id="resolution-val" class="status-val">-</span></span
            >
          </div>
        </div>
        <div class="status-row">
          <span
            ><strong>LO Frequency:</strong>
            <span id="lo-freq-val" class="status-val">99.30 MHz</span></span
          >
          <div class="diag-group">
            <span class="diag-label">Diagnostics:</span>
            <span
              >Temp:
              <span id="telemetry-temp" class="status-val strong">-- °C</span></span
            >
            <span id="telemetry-vccint-span"
              >Vccint:
              <span id="telemetry-vccint" class="status-val strong">-- V</span></span
            >
            <span id="telemetry-vccoddr-span"
              >Vccoddr:
              <span id="telemetry-vccoddr" class="status-val strong">-- V</span></span
            >
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
