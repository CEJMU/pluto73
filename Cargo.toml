[package]
name = "pluto"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Computer Engineering Group (Chair of Computer Science XVII), Julius-Maximilians-Universität Würzburg"]
description = "SSB transceiver host application for the Pluto+ SDR"

[dependencies]
hound = "3.4.0"
industrial-io = "0.6.1"
rustfft = "6.4.1"
num-complex = "0.4"
tokio = { version = "1.40", features = ["macros", "rt", "sync", "signal"] }
warp = { version = "0.3.7", features = ["websocket", "tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
orion-sdr = "0.0.33"
memmap2 = "0.9.10"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
